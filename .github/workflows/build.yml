# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: check generated data is up to date
        run: |
          ./gradlew runDatagen
          git add -N src/main/generated
          git diff --exit-code -- src/main/generated ':!src/main/generated/.cache'
      - name: boot dedicated server
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          # start the server, send "stop" as soon as it reports "Done", fail if that never happens
          timeout 600 bash -c '( while ! grep -q "Done (" server.log 2>/dev/null; do sleep 2; done; echo stop ) | ./gradlew runServer --console=plain > server.log 2>&1' || true
          if ! grep -q "Done (" server.log; then tail -n 150 server.log; exit 1; fi
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/